<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Deep cinematic blue background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08131F"/>
      <stop offset="52%" stop-color="#102333"/>
      <stop offset="100%" stop-color="#1C3447"/>
    </linearGradient>

    <!-- Main flowing layer -->
    <linearGradient id="flow1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#31566D" stop-opacity="0.12"/>
      <stop offset="48%" stop-color="#527B92" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8CB3C9" stop-opacity="0.46"/>
    </linearGradient>

    <!-- Secondary flowing layer -->
    <linearGradient id="flow2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#173246" stop-opacity="0.12"/>
      <stop offset="55%" stop-color="#31566D" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#5F8AA3" stop-opacity="0.38"/>
    </linearGradient>

    <!-- Subtle atmospheric glow -->
    <radialGradient id="glow">
      <stop offset="0%" stop-color="#79A7C0" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#79A7C0" stop-opacity="0"/>
    </radialGradient>

  </defs>


  <!-- ====================================================== -->
  <!-- BACKGROUND -->
  <!-- ====================================================== -->

  <rect
    width="1200"
    height="220"
    fill="url(#bg)"
  />


  <!-- ====================================================== -->
  <!-- ATMOSPHERIC LIGHT -->
  <!-- ====================================================== -->

  <ellipse
    cx="1010"
    cy="72"
    rx="300"
    ry="150"
    fill="url(#glow)"
  />


  <!-- ====================================================== -->
  <!-- ABSTRACT FLOWING LAYERS -->
  <!-- ====================================================== -->

  <path
    d="
      M570 220
      C680 192 715 96 820 67
      C935 35 1040 105 1200 48
      V220
      Z
    "
    fill="url(#flow1)"
  />


  <path
    d="
      M650 220
      C760 184 795 119 885 91
      C985 60 1090 135 1200 88
      V220
      Z
    "
    fill="url(#flow2)"
  />


  <!-- ====================================================== -->
  <!-- FLOWING CONTOUR LINES -->
  <!-- ====================================================== -->

  <path
    d="
      M700 220
      C790 183 825 121 905 103
      C995 83 1080 139 1200 101
    "
    fill="none"
    stroke="#7FA5BA"
    stroke-width="1"
    opacity="0.42"
  />


  <path
    d="
      M755 220
      C835 190 870 150 935 132
      C1020 109 1100 157 1200 126
    "
    fill="none"
    stroke="#62869B"
    stroke-width="1"
    opacity="0.38"
  />


  <path
    d="
      M810 220
      C880 198 915 169 968 153
      C1040 132 1115 174 1200 148
    "
    fill="none"
    stroke="#8CB3C9"
    stroke-width="1"
    opacity="0.25"
  />


  <!-- ====================================================== -->
  <!-- SUBTLE HORIZON ACCENT -->
  <!-- ====================================================== -->

  <path
    d="
      M600 202
      C770 175 930 194 1200 151
    "
    fill="none"
    stroke="#6F98AE"
    stroke-width="1"
    opacity="0.22"
  />


  <!-- ====================================================== -->
  <!-- LEFT IDENTITY ACCENT -->
  <!-- ====================================================== -->

  <rect
    x="72"
    y="62"
    width="3"
    height="82"
    rx="1.5"
    fill="#8CB3C9"
  />


  <!-- ====================================================== -->
  <!-- NAME -->
  <!-- ====================================================== -->

  <text
    x="96"
    y="94"
    fill="#F1F5F7"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-0.5"
  >
    Varun Kumar Tomar
  </text>


  <!-- ====================================================== -->
  <!-- SUBTITLE -->
  <!-- ====================================================== -->

  <text
    x="98"
    y="128"
    fill="#AFC1CC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
  >
    Software Developer · CS Student
  </text>


  <!-- ====================================================== -->
  <!-- DIVIDER -->
  <!-- ====================================================== -->

  <line
    x1="98"
    y1="153"
    x2="420"
    y2="153"
    stroke="#385365"
    stroke-width="1"
  />


  <!-- ====================================================== -->
  <!-- TAGLINE -->
  <!-- ====================================================== -->

  <text
    x="98"
    y="181"
    fill="#78909E"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    letter-spacing="0.3"
  >
    Building · Exploring · Creating
  </text>

</svg>
