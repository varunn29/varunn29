<svg
  width="1200"
  height="220"
  viewBox="0 0 1200 220"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect
    width="1200"
    height="220"
    fill="url(#background)"
  />

  <!-- Main flowing shape -->
  <path
    d="M735 220
       C790 175 785 125 835 85
       C885 45 955 35 1035 0
       H1200
       V220
       Z"
    fill="#172033"
  />

  <!-- Secondary flowing shape -->
  <path
    d="M820 220
       C865 175 865 135 910 95
       C955 55 1025 40 1100 10
       H1200
       V220
       Z"
    fill="#1E293B"
    opacity="0.65"
  />

  <!-- Accent curve -->
  <path
    d="M805 220
       C855 170 855 130 905 88
       C950 50 1025 35 1110 0"
    fill="none"
    stroke="url(#accent)"
    stroke-width="2"
  />

  <!-- Secondary curve -->
  <path
    d="M875 220
       C915 180 915 145 955 110
       C1000 70 1065 55 1145 25"
    fill="none"
    stroke="#334155"
    stroke-width="1"
    opacity="0.8"
  />

  <!-- Subtle fade -->
  <rect
    x="600"
    y="0"
    width="300"
    height="220"
    fill="url(#fade)"
  />

  <!-- Accent line -->
  <rect
    x="72"
    y="67"
    width="4"
    height="78"
    fill="#60A5FA"
  />

  <!-- Name -->
  <text
    x="96"
    y="93"
    fill="#F8FAFC"
    font-family="Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
    letter-spacing="-0.5"
  >
    Varun Kumar Tomar
  </text>

  <!-- Description -->
  <text
    x="98"
    y="128"
    fill="#A8B3C2"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
  >
    Full-Stack Developer · Open Source Enthusiast · Builder
  </text>

  <!-- Divider -->
  <line
    x1="98"
    y1="153"
    x2="430"
    y2="153"
    stroke="#334155"
    stroke-width="1"
  />

  <!-- Tagline -->
  <text
    x="98"
    y="181"
    fill="#64748B"
    font-family="Arial, Helvetica, sans-serif"
    font-size="13"
    letter-spacing="0.3"
  >
    Building · Learning · Shipping
  </text>
</svg>
